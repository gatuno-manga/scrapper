name: gatuno

services:
  browserless:
    image: ghcr.io/browserless/chromium:v2.55.3
    container_name: gatuno-browserless
    restart: on-failure:3
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=300000
    networks:
      - gatuno-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/pressure"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: gatuno-flaresolverr
    restart: on-failure:3
    environment:
      - LOG_LEVEL=info
    networks:
      - gatuno-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: gatuno-scraper
    restart: on-failure:3
    env_file: .env
    environment:
      - BROWSER_URL=ws://browserless:3000
      - FLARESOLVERR_URL=http://flaresolverr:8191
    ports:
      # Loopback-only: the ops server exposes /metrics and (if PPROF_ENABLED)
      # pprof, neither of which should be reachable from outside the host.
      # The healthcheck below runs inside the container's own network
      # namespace and does not need this mapping at all.
      - "127.0.0.1:6060:6060"
    depends_on:
      browserless:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
    networks:
      - gatuno-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6060/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  gatuno-net:
    name: gatuno_gatuno-net
    driver: bridge
